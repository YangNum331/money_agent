[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "money-agent"
version = "0.2.0"
description = "A human-gated opportunity discovery and ranking agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YangNum331" }]
dependencies = [
  "httpx[socks]>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
money-agent = "money_agent.cli:main"
money-agent-gui = "money_agent.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/money_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
